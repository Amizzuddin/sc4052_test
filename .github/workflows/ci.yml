name: sc4052_test Pipeline
on:
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - '**'
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Install dependencies
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint (pre-commit)
      uses: pre-commit/action@v3.0.1
    - name: Run tests
      run: |
        pip install pytest --quiet
        python -m pytest --tb=short -q
      env:
        PYTHONPATH: .
    - name: Docker build
      run: |
        if [ -f docker-compose.yml ] || [ -f docker-compose.yaml ]; then
          docker compose build
        fi
    - name: Docker login & push
      env:
        DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      run: |
        if [ -z "$DOCKER_TOKEN" ]; then
          echo "DOCKER_TOKEN not set — skipping Docker push"
          exit 0
        fi
        REPO_NAME="${{ github.event.repository.name }}"
        echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin
        if [ -f docker-compose.yml ] || [ -f docker-compose.yaml ]; then
          sed -i "s|image:.*|image: $DOCKER_USERNAME/$REPO_NAME:latest|" docker-compose.yml docker-compose.yaml 2>/dev/null || true
          docker compose build
          docker compose push
        else
          docker build -t $DOCKER_USERNAME/$REPO_NAME:${{ github.sha }} .
          docker tag $DOCKER_USERNAME/$REPO_NAME:${{ github.sha }} $DOCKER_USERNAME/$REPO_NAME:latest
          docker push $DOCKER_USERNAME/$REPO_NAME
        fi
    - name: Deploy (optional)
      run: "echo \"No deployment configured — add your deploy command here.\""
